<!doctype html>
<html lang="en" data-theme="corporate">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Microsoft AI Ecosystem</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234b51bd'/%3E%3Cpath d='M16 43 32 15 48 43Z' fill='none' stroke='white' stroke-width='4'/%3E%3C/svg%3E">
  <script type="module" crossorigin src="/20261102_Microsoft_AI_ecosystem_public/assets/index-C0380HFc.js"></script>
  <link rel="stylesheet" crossorigin href="/20261102_Microsoft_AI_ecosystem_public/assets/index-Gbq_o6hu.css">
</head>
<body>
  <div id="loading" role="status">Loading presentation…</div>
  <main id="slide-scaler" tabindex="-1" aria-label="Microsoft AI Ecosystem presentation">
    <div id="slide-container"></div>
    <div id="slide-counter"></div>
    <div id="section-label"></div>
  </main>
  <button id="prev-slide" class="nav-arrow" aria-label="Previous slide or reveal">‹</button>
  <button id="next-slide" class="nav-arrow" aria-label="Next slide or reveal">›</button>
  <div id="top-controls">
    <button id="notes-toggle" class="chrome-button" aria-label="Toggle speaker notes (N)" aria-pressed="false" title="Notes (N)">▤</button>
    <button id="admin-toggle" class="chrome-button" aria-label="Presentation settings (A)" aria-expanded="false" aria-controls="admin-panel" title="Settings (A)">⚙</button>
  </div>
  <aside class="speaker-notes-overlay" aria-label="Speaker notes" aria-hidden="true"><div class="sn-body"></div></aside>
  <div id="admin-backdrop" hidden></div>
  <aside id="admin-panel" role="dialog" aria-modal="true" aria-labelledby="admin-title" hidden>
    <h2 id="admin-title">Presentation settings</h2>
    <button id="admin-close" aria-label="Close settings">×</button>
    <label for="theme-select">Theme</label>
    <select id="theme-select">
      <option value="orbit">Orbit</option>
      <option value="github-cosmos">GitHub Cosmos</option>
      <option value="warm">Warm</option>
      <option value="corporate">Corporate</option>
      <option value="cyberpunk">Cyberpunk</option>
    </select>
    <label><input id="setting-notes" type="checkbox"> Speaker notes</label>
    <label><input id="setting-numbers" type="checkbox" checked> Slide number</label>
    <label><input id="setting-sections" type="checkbox" checked> Section label</label>
    <form id="goto-form">
      <label class="sr-only" for="goto-slide">Go to slide</label>
      <input id="goto-slide" type="number" min="1" max="38" value="1">
      <button type="submit">Go to slide</button>
    </form>
    <button id="export-pdf" type="button">Export PDF / Print</button>
    <h3>Visible slides</h3>
    <ul id="slide-checklist"></ul>
  </aside>
  <div id="live-status" class="sr-only" aria-live="polite"></div>
</body>
</html>
